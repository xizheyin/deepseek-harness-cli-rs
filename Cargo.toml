[package]
name = "deepseek-harness-cli"
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.85"
description = "A Rust CLI for the DeepSeek Harness agent core"
license = "MIT"
repository = "https://github.com/xizheyin/deepseek-harness-cli-rs"
readme = "README.md"
publish = false

[[bin]]
name = "dsh"
path = "src/main.rs"

[dependencies]
cap-std = "=3.4.5"
diffy = { version = "=0.5.1", features = ["std"] }
futures-util = "0.3"
globset = "=0.4.18"
httpdate = "1.0"
regex = "=1.12.3"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
ryu-js = "=1.0.3"
rustix = { version = "=1.1.4", features = ["fs"] }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "rt", "time"] }
tokio-util = "0.7"
uuid = { version = "=1.18.1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "test-util"] }
